[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-lab"
version = "0.1.0"
description = "Crypto paper-trading research platform (simulation only, never places real trades)."
readme = "README.md"
requires-python = ">=3.11"
# Stage 1 uses only the standard library. Stage 2 adds pandas, numpy and ccxt.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
