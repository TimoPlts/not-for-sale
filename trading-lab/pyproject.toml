[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-lab"
version = "0.1.0"
description = "Crypto paper-trading research platform (simulation only, never places real trades)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "ccxt>=4.0",  # public market data only; never used for trading
]

[project.scripts]
trading-lab = "trading_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]  # pytest -n auto: the suite on every core
dashboard = ["streamlit>=1.50"]  # read-only web dashboard (trading-lab dashboard)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
