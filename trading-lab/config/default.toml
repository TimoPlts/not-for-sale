# trading-lab default configuration (paper trading only; no API keys are ever read).
# These values mirror the defaults in src/trading_lab/config.py.

[portfolio]
initial_cash = 10000.0
quote_currency = "USDT"

[market]
exchange = "binance"          # public market data only
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "DOGE/USDT"]
timeframe = "1h"

[execution]
fee_rate = 0.001              # 0.1% taker fee per fill
slippage_bps = 5.0            # adverse slippage in basis points
min_notional = 10.0           # minimum order value in quote currency
slippage_model = "fixed"      # "fixed" (slippage_bps) or "volume" (adds square-root market impact)
impact_coefficient = 1.0      # volume model: impact = coef * volatility * sqrt(order / avg bar volume)
volume_lookback = 20          # bars for average volume and volatility (known before the fill)
max_participation_pct = 0.0   # liquidity cap: max share of avg bar volume per order (0 = off)
entry_order_type = "market"   # "market" or "limit" entries
limit_offset_bps = 10.0       # limit entries: buy limit this far below the open
limit_ttl_bars = 3            # limit entries: cancel the unfilled rest after N bars
maker_fee_rate = 0.001        # fee for limit (maker) fills
short_borrow_bps_per_day = 2.0  # borrow cost of a simulated short per day held (0.02%/day), paid on cover

[risk]
max_position_pct = 0.25       # max value of one position as a fraction of equity
risk_per_trade_pct = 0.01     # equity lost if a stop-loss is hit (incl. costs)
stop_loss_pct = 0.05          # stop distance below the entry fill price
max_open_positions = 4
max_total_exposure_pct = 1.0  # 1.0 = fully invested, no leverage
allow_pyramiding = false      # add to an existing position?
allow_short = false           # true = an ensemble SELL with no long open opens a simulated short
                              # (fully collateralised, no leverage; borrow cost in [execution])
# Circuit breakers (0 disables). They block NEW entries; exits are always allowed.
max_drawdown_pct = 0.25       # kill switch: stop opening trades after a 25% drawdown
daily_loss_limit_pct = 0.05   # pause new entries for the rest of a UTC day after -5%
stop_loss_cooldown_bars = 3   # wait 3 bars before re-entering a symbol after a stop-out
flatten_on_halt = false       # true = also close all positions when the kill switch trips
# Optional exits (0 disables). Mirrored for shorts: their stops sit above and only move down.
trailing_stop_pct = 0.0       # e.g. 0.04 = stop trails 4% below the highest high since entry
trailing_activation_pct = 0.0 # e.g. 0.02 = only start trailing after a 2% gain over the average cost
take_profit_pct = 0.0         # e.g. 0.10 = take profit at average cost + 10%
max_holding_bars = 0          # time stop, e.g. 48 = exit at the next open after holding 48 bars (0 = off)
# Initial stop: "percent" (stop_loss_pct) or "atr" (atr_stop_multiple x ATR below the entry,
# clamped to [atr_stop_min_pct, atr_stop_max_pct]); sizing then risks the same equity share per trade.
stop_mode = "percent"
atr_period = 14               # true ranges averaged (bars before the fill only)
atr_stop_multiple = 2.0
atr_stop_min_pct = 0.005
atr_stop_max_pct = 0.25
# Volatility targeting (0 = off): each position may add at most this much annualised volatility
# as a share of equity, e.g. 0.10 -> a coin with 80% yearly volatility gets at most 12.5% of equity.
position_volatility_pct = 0.0
# Entry filters (off by default). They only block NEW entries; exits and breakers are unaffected.
trend_filter_period = 0       # e.g. 200 = no new entry while the close is below its 200-bar average
trend_filter_timeframe = ""    # "" = bars of market.timeframe; "1d" = the last N completed daily closes
block_entries_on_risk_states = []  # e.g. ["extreme"] or ["high", "extreme"] (labels from qwen_risk)
risk_state_max_age_bars = 8   # a reported risk_state stays in force this many bars
max_correlated_positions = 0  # e.g. 1 = no new entry while 1 open position moves with it (0 = off)
correlation_threshold = 0.8   # correlation of per-bar log returns that counts as "moves together"
correlation_lookback = 48     # bars in the rolling correlation

[data]
cache_dir = "data/cache"      # CSV cache of public candles
use_cache = true
page_limit = 1000             # candles per public request
funding_exchange = ""         # funding rates for the `funding` strategy: "" = the exchange's futures market

# Each [strategies.<name>] table enables one strategy. `enabled` and `weight`
# are generic; all other keys are strategy parameters.
[strategies.rsi]
enabled = true
weight = 1.0
period = 14
oversold = 30.0
overbought = 70.0

[strategies.macd]
enabled = true
weight = 1.0
fast = 12
slow = 26
signal = 9

[strategies.bollinger]
enabled = true
weight = 1.0
period = 20
num_std = 2.0

[voting]
buy_threshold = 0.15          # net weighted score needed to BUY
sell_threshold = 0.15         # net weighted score needed to SELL
min_agreeing = 1              # min number of strategies voting that way
# The desk's confirmation gate (off at 0): a new entry needs min_confirms of the named confirmers.
# confirm_mode "agree" = they vote the same way; "not_against" = they do not vote the other way (a veto).
confirmers = []               # e.g. ["funding", "sentiment"] (enabled strategies with a weight)
min_confirms = 0
confirm_mode = "agree"
# Optional regime-dependent weights (off unless present). The regime per symbol and bar is
# "up" (close above a rising 50-bar average), "down" (below a falling one) or "sideways".
# regime_bars = 50
# regime_slope_bars = 10
# [voting.regime_weights.up]
# donchian = 2.0                # trend followers count double in trends ...
# rsi = 0.5
# [voting.regime_weights.sideways]
# donchian = 0.0                # ... and not at all in sideways markets

[backtest]
liquidate_at_end = false      # true = sell open positions at the final close

[storage]
db_path = "data/trading_lab.db"   # SQLite history of runs, signals, decisions, trades
record_trials = false             # true = log every backtest/sweep/ab/checkup result, so `trading-lab trials`
                                  # and `checkup` can count how many configs you tried on the same data

# Qwen agents (one shared model, three roles; see README "Qwen agents").
# weight = 0 switches an agent off completely: it is never called and casts no vote.
# Set a positive weight to let it vote; QWEN_API_URL/QWEN_MODEL/QWEN_API_KEY must then be set.
[strategies.qwen_trend]
enabled = true
weight = 0.0
lookback = 40                 # candles shown to the model
decision_interval = 4         # ask every N candles (HOLD in between)
# portfolio_context = false   # true adds position status (answers then depend on the trade path)

[strategies.qwen_momentum]
enabled = true
weight = 0.0
lookback = 30
decision_interval = 4

[strategies.qwen_risk]
enabled = true
weight = 0.0
lookback = 30
decision_interval = 4
# portfolio_context = true    # default: sees exposure, open positions, stop-outs, breakers

# Trend-following strategies (off unless their table is present; they suit allow_short):
# [strategies.ma_cross]
# weight = 1.0
# fast = 20
# slow = 50
# average = "sma"             # or "ema"
# signal_on = "cross"         # or "state": BUY/SELL on every bar the fast average is above/below
#
# [strategies.donchian]
# weight = 1.0
# entry_period = 20           # BUY above the previous 20-bar high, SELL below the 20-bar low
# exit_period = 10            # weaker opposite signal on a 10-bar break (0 = off)
# atr_period = 14             # confidence grows with the breakout distance in ATRs

# A general-purpose model analyst is also available:
# [strategies.llm_analyst]
# weight = 1.0
# lookback = 30
# decision_interval = 4

[agents]
mode = "record"               # record | replay | live (see README: AI agents)
cache_path = "data/agent_cache.db"
# LLM provider for model-backed agents: "qwen" (any OpenAI-compatible endpoint) or
# "anthropic" (Claude). The endpoint, model and key come ONLY from environment variables,
# never this file: QWEN_API_URL, QWEN_MODEL, QWEN_API_KEY, or ANTHROPIC_MODEL,
# ANTHROPIC_API_KEY (and optionally ANTHROPIC_API_URL).
provider = "qwen"
request_timeout_seconds = 30.0  # per request
max_retries = 2               # retries after a timeout, network error, HTTP 429 or 5xx
retry_backoff_seconds = 1.0   # wait before the first retry; doubles each time
temperature = 0.0             # part of the cache key, like the model and the prompt
max_output_tokens = 512       # raise this for models that think aloud before answering
failure_threshold = 5         # after 5 failed calls in a row, stop calling the model ...
failure_cooldown_seconds = 300.0  # ... for 5 minutes (agents vote HOLD meanwhile); 0 = never

[alerts]
# Push notifications from live paper trading. The webhook URL comes ONLY from the
# TRADING_LAB_ALERT_URL environment variable (e.g. https://ntfy.sh/<your-secret-topic>).
enabled = false
channels = ["webhook"]        # webhook, email and/or telegram (settings ONLY from environment variables)
format = "ntfy"               # ntfy | slack | discord | json (webhook only)
min_level = "warning"         # "info" also reports every entry and exit
daily_summary = true          # a run summary after each UTC day
outage_after_cycles = 3       # alert when this many cycles in a row could not be processed
repeat_after_minutes = 60.0   # do not repeat the same alert sooner
