# trading-lab default configuration (paper trading only; no API keys are ever read).
# These values mirror the defaults in src/trading_lab/config.py.

[portfolio]
initial_cash = 10000.0
quote_currency = "USDT"

[market]
exchange = "binance"          # public market data only
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "DOGE/USDT"]
timeframe = "1h"

[execution]
fee_rate = 0.001              # 0.1% taker fee per fill
slippage_bps = 5.0            # adverse slippage in basis points
min_notional = 10.0           # minimum order value in quote currency
slippage_model = "fixed"      # "fixed" (slippage_bps) or "volume" (adds square-root market impact)
impact_coefficient = 1.0      # volume model: impact = coef * volatility * sqrt(order / avg bar volume)
volume_lookback = 20          # bars for average volume and volatility (known before the fill)
max_participation_pct = 0.0   # liquidity cap: max share of avg bar volume per order (0 = off)
entry_order_type = "market"   # "market" or "limit" entries
limit_offset_bps = 10.0       # limit entries: buy limit this far below the open
limit_ttl_bars = 3            # limit entries: cancel the unfilled rest after N bars
maker_fee_rate = 0.001        # fee for limit (maker) fills

[risk]
max_position_pct = 0.25       # max value of one position as a fraction of equity
risk_per_trade_pct = 0.01     # equity lost if a stop-loss is hit (incl. costs)
stop_loss_pct = 0.05          # stop distance below the entry fill price
max_open_positions = 4
max_total_exposure_pct = 1.0  # 1.0 = fully invested, no leverage
allow_pyramiding = false      # add to an existing position?
# Circuit breakers (0 disables). They block NEW entries; exits are always allowed.
max_drawdown_pct = 0.25       # kill switch: stop opening trades after a 25% drawdown
daily_loss_limit_pct = 0.05   # pause new entries for the rest of a UTC day after -5%
stop_loss_cooldown_bars = 3   # wait 3 bars before re-entering a symbol after a stop-out
flatten_on_halt = false       # true = also close all positions when the kill switch trips

[data]
cache_dir = "data/cache"      # CSV cache of public candles
use_cache = true
page_limit = 1000             # candles per public request

# Each [strategies.<name>] table enables one strategy. `enabled` and `weight`
# are generic; all other keys are strategy parameters.
[strategies.rsi]
enabled = true
weight = 1.0
period = 14
oversold = 30.0
overbought = 70.0

[strategies.macd]
enabled = true
weight = 1.0
fast = 12
slow = 26
signal = 9

[strategies.bollinger]
enabled = true
weight = 1.0
period = 20
num_std = 2.0

[voting]
buy_threshold = 0.15          # net weighted score needed to BUY
sell_threshold = 0.15         # net weighted score needed to SELL
min_agreeing = 1              # min number of strategies voting that way

[backtest]
liquidate_at_end = false      # true = sell open positions at the final close

[storage]
db_path = "data/trading_lab.db"   # SQLite history of runs, signals, decisions, trades

# Qwen agents (one shared model, three roles; see README "Qwen agents").
# weight = 0 switches an agent off completely: it is never called and casts no vote.
# Set a positive weight to let it vote; QWEN_API_URL/QWEN_MODEL/QWEN_API_KEY must then be set.
[strategies.qwen_trend]
enabled = true
weight = 0.0
lookback = 40                 # candles shown to the model
decision_interval = 4         # ask every N candles (HOLD in between)
# portfolio_context = false   # true adds position status (answers then depend on the trade path)

[strategies.qwen_momentum]
enabled = true
weight = 0.0
lookback = 30
decision_interval = 4

[strategies.qwen_risk]
enabled = true
weight = 0.0
lookback = 30
decision_interval = 4
# portfolio_context = true    # default: sees exposure, open positions, stop-outs, breakers

# A general-purpose model analyst is also available:
# [strategies.llm_analyst]
# weight = 1.0
# lookback = 30
# decision_interval = 4

[agents]
mode = "record"               # record | replay | live (see README: AI agents)
cache_path = "data/agent_cache.db"
# LLM provider for model-backed agents. The endpoint, model and token come ONLY
# from environment variables (QWEN_API_URL, QWEN_MODEL, QWEN_API_KEY), never this file.
provider = "qwen"
request_timeout_seconds = 30.0  # per request
max_retries = 2               # retries after a timeout, network error, HTTP 429 or 5xx
retry_backoff_seconds = 1.0   # wait before the first retry; doubles each time
temperature = 0.0             # part of the cache key, like the model and the prompt
max_output_tokens = 512       # raise this for models that think aloud before answering
