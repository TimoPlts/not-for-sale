# trading-lab default configuration (paper trading only; no API keys are ever read).
# These values mirror the defaults in src/trading_lab/config.py.

[portfolio]
initial_cash = 10000.0
quote_currency = "USDT"

[market]
exchange = "binance"          # public market data only
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "DOGE/USDT"]
timeframe = "1h"

[execution]
fee_rate = 0.001              # 0.1% taker fee per fill
slippage_bps = 5.0            # adverse slippage in basis points
min_notional = 10.0           # minimum order value in quote currency

[risk]
max_position_pct = 0.25       # max value of one position as a fraction of equity
risk_per_trade_pct = 0.01     # equity lost if a stop-loss is hit (incl. costs)
stop_loss_pct = 0.05          # stop distance below the entry fill price
max_open_positions = 4
max_total_exposure_pct = 1.0  # 1.0 = fully invested, no leverage
allow_pyramiding = false      # add to an existing position?
# Circuit breakers (0 disables). They block NEW entries; exits are always allowed.
max_drawdown_pct = 0.25       # kill switch: stop opening trades after a 25% drawdown
daily_loss_limit_pct = 0.05   # pause new entries for the rest of a UTC day after -5%
stop_loss_cooldown_bars = 3   # wait 3 bars before re-entering a symbol after a stop-out
flatten_on_halt = false       # true = also close all positions when the kill switch trips

[data]
cache_dir = "data/cache"      # CSV cache of public candles
use_cache = true
page_limit = 1000             # candles per public request

# Each [strategies.<name>] table enables one strategy. `enabled` and `weight`
# are generic; all other keys are strategy parameters.
[strategies.rsi]
enabled = true
weight = 1.0
period = 14
oversold = 30.0
overbought = 70.0

[strategies.macd]
enabled = true
weight = 1.0
fast = 12
slow = 26
signal = 9

[strategies.bollinger]
enabled = true
weight = 1.0
period = 20
num_std = 2.0

[voting]
buy_threshold = 0.15          # net weighted score needed to BUY
sell_threshold = 0.15         # net weighted score needed to SELL
min_agreeing = 1              # min number of strategies voting that way

[backtest]
liquidate_at_end = false      # true = sell open positions at the final close

[storage]
db_path = "data/trading_lab.db"   # SQLite history of runs, signals, decisions, trades
